<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birinci Ay Sürprizi ❤️</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#ffe6ef,#fff7fb);color:#333;overflow:hidden}.card{width:min(90%,430px);padding:38px 28px;text-align:center;background:rgba(255,255,255,.94);border-radius:28px;box-shadow:0 15px 50px rgba(180,70,110,.18)}h1{font-size:28px;margin:0 0 12px}p{font-size:17px;line-height:1.6}.heart{font-size:54px;margin-bottom:10px}input{width:100%;padding:15px;margin:15px 0 10px;border:2px solid #f0bfd0;border-radius:14px;font-size:18px;text-align:center;outline:none}button{width:100%;padding:15px;border:0;border-radius:14px;background:#e85b89;color:#fff;font-size:17px;font-weight:700}#surprise{display:none}#msg{color:#d33;min-height:24px;margin:8px 0}.confetti{position:fixed;top:-20px;font-size:22px;animation:fall 3s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>
<div class="card" id="login">
<div class="heart">🎁</div>
<h1>Bu hediye senin için hazırlandı ❤️</h1>
<p>İçeri girmek için özel şifreyi gir.</p>
<input id="password" type="password" placeholder="Şifre">
<button onclick="checkPassword()">Sürprizi Aç ✨</button>
<div id="msg"></div>
</div>
<div class="card" id="surprise">
<div class="heart">🎉❤️🎉</div>
<h1>Birinci ayımız kutlu olsun! 🥰</h1>
<p>Seninle geçen bu ilk ayın her anı benim için çok özel.</p>
<p><strong>İyi ki hayatımdasın. ❤️</strong></p>
<p>Nice güzel aylara… 🌹</p>
</div>
<script>
const correctPassword="17.07.2025";
function checkPassword(){const value=document.getElementById("password").value;if(value===correctPassword){document.getElementById("login").style.display="none";document.getElementById("surprise").style.display="block";launchConfetti()}else{document.getElementById("msg").textContent="Şifre yanlış 😌 Bir daha dene."}}
function launchConfetti(){const symbols=["🎉","🎊","❤️","💖","✨","🌹"];for(let i=0;i<90;i++){const c=document.createElement("div");c.className="confetti";c.textContent=symbols[Math.floor(Math.random()*symbols.length)];c.style.left=Math.random()*100+"vw";c.style.animationDelay=Math.random()*1.5+"s";c.style.animationDuration=2.5+Math.random()*2+"s";document.body.appendChild(c);setTimeout(()=>c.remove(),5000)}}
document.getElementById("password").addEventListener("keydown",e=>{if(e.key==="Enter")checkPassword()});
</script>
</body>
</html>
